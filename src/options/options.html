<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="options.css">
    <title>Voice Input — Settings</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
          </span>
          <h1 data-i18n="optTitle"></h1>
        </div>
      </header>

      <div class="layout">
        <nav class="sidebar" role="tablist" aria-label="Settings sections">
          <button class="nav-item is-active" data-tab="general" role="tab" aria-selected="true">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
              </svg>
            </span>
            <span data-i18n="optGeneral"></span>
          </button>
          <button class="nav-item" data-tab="advanced" role="tab" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
            </span>
            <span data-i18n="optAdvanced"></span>
          </button>
          <button class="nav-item" data-tab="replacements" role="tab" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 1l4 4-4 4"></path>
                <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                <path d="M7 23l-4-4 4-4"></path>
                <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
              </svg>
            </span>
            <span data-i18n="optReplacements"></span>
          </button>
          <button class="nav-item" data-tab="settings-management" role="tab" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
              </svg>
            </span>
            <span data-i18n="optSettingsManagement"></span>
          </button>
          <button class="nav-item is-bottom" data-tab="about" role="tab" aria-selected="false">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
            </span>
            <span data-i18n="optAbout"></span>
          </button>
        </nav>

        <main class="panel">
          <section class="tab-pane is-active" data-tab="general" role="tabpanel">
            <div class="field">
              <label for="maxAlternatives" data-i18n="optMaxAlternatives"></label>
              <input type="number" id="maxAlternatives" min="1" max="10" step="1">
              <p class="hint" data-i18n="optMaxAlternativesHint"></p>
            </div>

            <div class="field toggle-row">
              <div class="toggle-text">
                <span class="toggle-label" data-i18n="optAutoInsertIfSingle"></span>
              </div>
              <label class="switch">
                <input type="checkbox" id="autoInsertIfSingle">
                <span class="slider"></span>
              </label>
            </div>

            <div class="field">
              <label for="lang" data-i18n="optLang"></label>
              <select id="lang"></select>
            </div>
          </section>

          <section class="tab-pane" data-tab="replacements" role="tabpanel" hidden>
            <div class="field">
              <label data-i18n="optReplacementsTitle"></label>
              <p class="hint" data-i18n="optReplacementsHint"></p>
              <div id="replacements" class="replacement-list"></div>
              <p id="replacements-empty" class="empty-state" data-i18n="optReplacementsEmpty"></p>
              <button id="add-replacement" class="ghost" data-i18n="optAddReplacement"></button>
            </div>
          </section>

          <section class="tab-pane" data-tab="advanced" role="tabpanel" hidden>
            <div class="field toggle-row">
              <div class="toggle-text">
                <span class="toggle-label" data-i18n="optContinuous"></span>
                <p class="hint" data-i18n="optContinuousHint"></p>
              </div>
              <label class="switch">
                <input type="checkbox" id="continuous">
                <span class="slider"></span>
              </label>
            </div>

            <div class="field toggle-row">
              <div class="toggle-text">
                <span class="toggle-label" data-i18n="optInterimResults"></span>
                <p class="hint" data-i18n="optInterimResultsHint"></p>
              </div>
              <label class="switch">
                <input type="checkbox" id="interimResults">
                <span class="slider"></span>
              </label>
            </div>

            <div class="field">
              <label data-i18n="optShortcutsTitle"></label>
              <p class="hint" data-i18n="optShortcutsHint"></p>
              <button id="open-shortcuts" class="ghost" data-i18n="optOpenShortcuts"></button>
            </div>
          </section>

          <section class="tab-pane" data-tab="settings-management" role="tabpanel" hidden>
            <div class="field">
              <label data-i18n="optExportSettingsTitle"></label>
              <p class="hint" data-i18n="optExportSettingsHint"></p>
              <button id="export-settings" class="ghost" data-i18n="optExportSettings"></button>
              <p id="export-settings-status" class="management-status" hidden></p>
            </div>

            <div class="field">
              <label data-i18n="optImportSettingsTitle"></label>
              <p class="hint" data-i18n="optImportSettingsHint"></p>
              <button id="import-settings" class="ghost" data-i18n="optImportSettings"></button>
              <input id="import-settings-file" type="file" accept="application/json,.json" hidden>
              <p id="import-settings-status" class="management-status" hidden></p>
            </div>

            <div class="field">
              <label data-i18n="optResetTitle"></label>
              <p class="hint" data-i18n="optResetHint"></p>
              <button id="reset" class="ghost" data-i18n="optReset"></button>
            </div>
          </section>

          <section class="tab-pane" data-tab="about" role="tabpanel" hidden>
            <div class="field">
              <label data-i18n="optAboutTitle"></label>
              <div class="about-list">
                <div class="about-row">
                  <span class="about-label" data-i18n="optAboutVersion"></span>
                  <span id="about-version" class="about-value"></span>
                </div>
                <div class="about-row">
                  <span class="about-label" data-i18n="optAboutGithub"></span>
                  <a class="about-link" href="https://github.com/yhchiu/VoiceInput" target="_blank" rel="noopener noreferrer">github.com/yhchiu/VoiceInput</a>
                </div>
                <div class="about-row">
                  <span class="about-label" data-i18n="optAboutIssues"></span>
                  <a class="about-link" href="https://github.com/yhchiu/VoiceInput/issues" target="_blank" rel="noopener noreferrer" data-i18n="optAboutIssuesLink"></a>
                </div>
                <div class="about-row">
                  <span class="about-label" data-i18n="optAboutLicense"></span>
                  <a class="about-link" href="https://github.com/yhchiu/VoiceInput/blob/master/LICENSE" target="_blank" rel="noopener noreferrer">GNU GPLv3</a>
                </div>
              </div>
            </div>

            <div class="field">
              <label data-i18n="optAboutPrivacy"></label>
              <p class="hint" data-i18n="optAboutPrivacyText"></p>
            </div>
          </section>

          <footer class="actions">
            <span id="saved" class="saved" hidden>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span data-i18n="optSaved"></span>
            </span>
          </footer>
        </main>
      </div>
    </div>

    <script src="../common/messages.js"></script>
    <script src="../common/settings.js"></script>
    <script src="../common/languages.js"></script>
    <script src="../common/i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
