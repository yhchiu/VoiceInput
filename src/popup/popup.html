<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="card">
      <h1 class="title" data-i18n="popupTitle"></h1>
      <div class="status" id="status">—</div>
      <div class="field recent-result" aria-live="polite">
        <label data-i18n="popupRecentResult"></label>
        <div class="recent-result-row">
          <p id="recent-result-text" class="recent-result-text" data-i18n="popupNoRecentResult"></p>
          <button id="copy-recent" class="icon-button" type="button" disabled>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
        <p id="copy-status" class="copy-status" hidden></p>
      </div>
      <div class="field">
        <label for="lang" data-i18n="optLang"></label>
        <select id="lang"></select>
      </div>
      <label class="toggle-row" for="continuous">
        <span data-i18n="optContinuous"></span>
        <input type="checkbox" id="continuous">
      </label>
      <button id="start" class="primary" data-i18n="popupStart"></button>
      <p id="start-status" class="copy-status start-status" role="alert" hidden></p>
      <p class="hint" data-i18n="popupHint"></p>
      <div class="field common-phrases-field">
        <button type="button" id="common-phrases-toggle" class="phrase-toggle" aria-expanded="false" aria-controls="common-phrases-panel">
          <span class="phrase-toggle-label" data-i18n="commonPhrases"></span>
          <span class="phrase-toggle-meta">
            <span id="common-phrases-count" class="phrase-toggle-count" hidden></span>
            <svg class="phrase-toggle-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
          </span>
        </button>
        <div id="common-phrases-panel" class="phrase-panel" hidden>
          <div id="common-phrases" class="phrase-list"></div>
          <p id="common-phrases-empty" class="empty-state" data-i18n="commonPhrasesEmpty"></p>
        </div>
        <p id="phrase-status" class="copy-status" hidden></p>
      </div>
      <div class="links">
        <button id="open-options" class="link" data-i18n="popupOpenOptions"></button>
      </div>
    </div>
    <script src="../common/messages.js"></script>
    <script src="../common/settings.js"></script>
    <script src="../common/languages.js"></script>
    <script src="../common/i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
